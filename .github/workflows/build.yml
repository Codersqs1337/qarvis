name: Build Qarvis APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK (platform 34, build-tools, platform-tools) is preinstalled on
      # ubuntu-latest with ANDROID_HOME/ANDROID_SDK_ROOT set and licenses accepted.
      # We rely on it directly: the old android-actions/setup-android@v3 step failed
      # trying to install the long-removed legacy "tools" package.

      - name: Fetch Vosk offline model
        run: |
          curl -fL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/model-en-us
          mv vosk-model-small-en-us-0.15 app/src/main/assets/model-en-us
          cat /proc/sys/kernel/random/uuid > app/src/main/assets/model-en-us/uuid
          du -sh app/src/main/assets/model-en-us

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
